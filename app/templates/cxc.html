<!-- Modal Registrar Cobro Avanzado (Multimoneda y Descuento) -->
<div class="modal fade" id="modalRegistrarCobro" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <form action="{{ url_for('main.registrar_cobro_avanzado') }}" method="POST">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title fw-bold"><i class="fas fa-hand-holding-usd me-2"></i> Registrar Cobro de Cuota</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" name="cxc_id" id="cobroCxcId">
                    
                    <div class="alert alert-light border p-3 mb-3">
                        <div class="row">
                            <div class="col-md-4"><strong>Concepto:</strong> <span id="lblCobroConcepto">-</span></div>
                            <div class="col-md-4"><strong>Vencimiento:</strong> <span id="lblCobroVencimiento">-</span></div>
                            <div class="col-md-4"><strong>Saldo Cuota:</strong> <span id="lblCobroSaldo" class="text-danger fw-bold">-</span></div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label fw-bold">Moneda del Cobro</label>
                            <select class="form-select" name="moneda_cobro" id="monedaCobro" onchange="toggleMonedaCobro(this)">
                                <option value="PYG">PYG (₲)</option>
                                <option value="USD">USD ($)</option>
                                <option value="BRL">BRL (R$)</option>
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label fw-bold">Cotización del Día</label>
                            <input type="number" step="any" class="form-control" name="cotizacion" id="inputCotizacion" value="1" oninput="calcularEquivalenteCobro()">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label fw-bold">Monto Recibido</label>
                            <input type="number" step="any" class="form-control" name="monto_recibido" id="inputMontoRecibido" required oninput="calcularEquivalenteCobro()">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Descuento Concedido (Opcional)</label>
                            <input type="number" step="any" class="form-control" name="descuento" value="0" placeholder="0">
                            <small class="text-muted">Reduce el saldo sin generar dinero recibido.</small>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Motivo del Descuento</label>
                            <input type="text" class="form-control" name="motivo_descuento" placeholder="Ej: Cortesía institucional">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Forma de Cobro</label>
                            <select class="form-select" name="forma_cobro" required>
                                <option value="Efectivo">Efectivo</option>
                                <option value="Transferencia">Transferencia</option>
                                <option value="Tarjeta de crédito">Tarjeta de crédito</option>
                                <option value="POS">POS</option>
                                <option value="PIX">PIX</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Cuenta de Baja (Ingreso)</label>
                            <select class="form-select" name="cuenta_id" required>
                                <option value="">Seleccionar cuenta...</option>
                                {% for c in cuentas %}
                                <option value="{{ c.id }}">{{ c.nombre }} ({{ c.moneda }})</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="alert alert-info py-2 px-3 mt-2 mb-0">
                        <small><strong>Equivalente calculado en Gs.:</strong> <span id="lblEquivalenteGs">0</span> Gs.</small>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-success fw-bold px-4">Confirmar Cobro</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
function toggleMonedaCobro(select) {
    let cotiz = document.getElementById('inputCotizacion');
    if(select.value === 'PYG') {
        cotiz.value = 1;
        cotiz.readOnly = true;
    } else {
        cotiz.readOnly = false;
        cotiz.value = select.value === 'USD' ? 7500 : 1400; // Referencial
    }
    calcularEquivalenteCobro();
}

function calcularEquivalenteCobro() {
    let monto = parseFloat(document.getElementById('inputMontoRecibido').value) || 0;
    let cotiz = parseFloat(document.getElementById('inputCotizacion').value) || 1;
    let totalGs = monto * cotiz;
    document.getElementById('lblEquivalenteGs').innerText = totalGs.toLocaleString('es-PY', {maximumFractionDigits: 0});
}
</script>
